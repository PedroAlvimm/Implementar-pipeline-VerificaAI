[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verificaai"
version = "0.1.0"
description = "Sistema auditável de apoio à verificação de informações em português brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2",
  "trafilatura>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
bertimbau = [
  "huggingface-hub>=1.0,<2",
  "torch>=2.9,<3",
  "transformers>=5.0,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
